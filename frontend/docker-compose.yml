services:
  # Sender Convex Backend
  convex-sender:
    image: ghcr.io/get-convex/convex-backend:latest
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "3210:3210"
      - "3211:3211"
    volumes:
      - convex-sender-data:/convex/data
    environment:
      - CONVEX_CLOUD_ORIGIN=http://127.0.0.1:3210
      - CONVEX_SITE_ORIGIN=http://127.0.0.1:3211
      - DOCUMENT_RETENTION_DELAY=172800
      - RUST_LOG=info
      - INSTANCE_NAME=sender
    healthcheck:
      test: curl -f http://localhost:3210/version
      interval: 5s
      start_period: 10s

  # Transporter Convex Backend
  convex-transporter:
    image: ghcr.io/get-convex/convex-backend:latest
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "3220:3210"
      - "3221:3211"
    volumes:
      - convex-transporter-data:/convex/data
    environment:
      - CONVEX_CLOUD_ORIGIN=http://127.0.0.1:3220
      - CONVEX_SITE_ORIGIN=http://127.0.0.1:3221
      - DOCUMENT_RETENTION_DELAY=172800
      - RUST_LOG=info
      - INSTANCE_NAME=transporter
    healthcheck:
      test: curl -f http://localhost:3210/version
      interval: 5s
      start_period: 10s

  # Receiver Convex Backend
  convex-receiver:
    image: ghcr.io/get-convex/convex-backend:latest
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "3230:3210"
      - "3231:3211"
    volumes:
      - convex-receiver-data:/convex/data
    environment:
      - CONVEX_CLOUD_ORIGIN=http://127.0.0.1:3230
      - CONVEX_SITE_ORIGIN=http://127.0.0.1:3231
      - DOCUMENT_RETENTION_DELAY=172800
      - RUST_LOG=info
      - INSTANCE_NAME=receiver
    healthcheck:
      test: curl -f http://localhost:3210/version
      interval: 5s
      start_period: 10s

  # Sender Dashboard
  dashboard-sender:
    image: ghcr.io/get-convex/convex-dashboard:latest
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "6791:6791"
    environment:
      - NEXT_PUBLIC_DEPLOYMENT_URL=http://127.0.0.1:3210
    depends_on:
      convex-sender:
        condition: service_healthy

  # Transporter Dashboard
  dashboard-transporter:
    image: ghcr.io/get-convex/convex-dashboard:latest
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "6792:6791"
    environment:
      - NEXT_PUBLIC_DEPLOYMENT_URL=http://127.0.0.1:3220
    depends_on:
      convex-transporter:
        condition: service_healthy

  # Receiver Dashboard
  dashboard-receiver:
    image: ghcr.io/get-convex/convex-dashboard:latest
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "6793:6791"
    environment:
      - NEXT_PUBLIC_DEPLOYMENT_URL=http://127.0.0.1:3230
    depends_on:
      convex-receiver:
        condition: service_healthy

volumes:
  convex-sender-data:
  convex-transporter-data:
  convex-receiver-data:
